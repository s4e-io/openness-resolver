name: ci

on:
  push:
    branches: [dev, main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    # Any target branch (stacked PRs use feature bases, not only main).
    branches: ['**']

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [[ -n "$bad" ]]; then
            echo "gofmt needed on:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Version consistency
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '[:space:]' <VERSION)"
          CODE_VER="$(sed -n 's/^[[:space:]]*Version = "\([^"]*\)"/\1/p' internal/buildinfo/buildinfo.go | head -1)"
          echo "VERSION file=${FILE_VER}"
          echo "buildinfo.go=${CODE_VER}"
          test "$FILE_VER" = "$CODE_VER"

  test:
    name: test-linux
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regression fixture present
        run: |
          set -euo pipefail
          test -s testdata/normalized/ubuntu/jammy/rules.json

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        run: |
          set -euo pipefail
          bash scripts/build.sh
          VERSION="$(tr -d '[:space:]' <VERSION)"
          ./dist/openness-resolver_${VERSION}_linux_amd64 version

      - name: CLI smoke (help and dry run, offline)
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          BIN=./dist/openness-resolver_${VERSION}_linux_amd64
          $BIN help 2>&1 | grep -F "usage: openness-resolver <command>"
          $BIN feed sync --for testdata/evidence/synthetic/alpine-3.20.openness --dry-run

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openness-resolver-linux-${{ github.sha }}
          path: |
            dist/openness-resolver_*_linux_amd64
            dist/openness-resolver_*_linux_arm64
          if-no-files-found: error

  test-windows:
    name: test-windows
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Line endings are LF
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --eol | awk '$2 ~ /crlf/' | grep .; then
            echo "files checked out with CRLF; see .gitattributes"
            exit 1
          fi

      - name: Test (unit, golden end-to-end, flags)
        run: go test ./...

      - name: Build Windows binary
        shell: bash
        run: |
          set -euo pipefail
          go build -o dist/openness-resolver.exe ./cmd/openness-resolver
          ./dist/openness-resolver.exe version
          ./dist/openness-resolver.exe feed sync --for testdata/evidence/synthetic/windows-server-2022.openness --months 2 --dry-run
